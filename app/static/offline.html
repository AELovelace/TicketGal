<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#071f4a">
  <title>TicketGal is offline</title>
  <link rel="icon" href="/static/icons/ticketgal-192.png">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="pwa-offline-page">
  <main class="pwa-offline-card card">
    <img src="/static/icons/ticketgal-192.png" alt="" width="96" height="96">
    <p class="card-kicker">CONNECTION NEEDED</p>
    <h1>TicketGal is offline</h1>
    <p class="muted">Reconnect to the internet to view or update support tickets.</p>
    <form action="/" method="get">
      <button type="submit">Try Again</button>
    </form>
  </main>
</body>
</html>
